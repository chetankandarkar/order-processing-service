spring.application.name=orderprocessing
server.port= 6060

# H2 FILE database location
spring.datasource.url=jdbc:h2:file:D:/ORDER_PROCESSING
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate

# H2 Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.hibernate.SQL=DEBUG

# ActiveMQ Configuration
spring.activemq.broker-url=tcp://localhost:61616
spring.activemq.user=admin
spring.activemq.password=admin

camel.component.activemq.broker-url=tcp://localhost:61616
camel.component.activemq.transacted=true

# Camel Configuration
camel.springboot.main-run-controller=true

# ActiveMQ Queue
order.created.queue=ORDER.CREATED.QUEUE
order.queue.consumer.enabled=true

# File paths
order.file.input.path=D:/ORDER_PROCESSING/input/orders/
order.file.error.path=D:/ORDER_PROCESSING/error/orders/

# Enable / Disable route
order.file.route.enabled=true

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1



